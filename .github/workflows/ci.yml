name: Check app

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Initialize isolated local database configuration
        run: |
          mkdir -p "$RUNNER_TEMP/blindsolve-db"
          npx --yes supabase@3.0.0 init --workdir "$RUNNER_TEMP/blindsolve-db" --yes
          cp -R supabase/migrations supabase/tests "$RUNNER_TEMP/blindsolve-db/supabase/"
      - name: Run current sync RPC contract tests
        run: |
          npx --yes supabase@3.0.0 start --workdir "$RUNNER_TEMP/blindsolve-db" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor
          npx --yes supabase@3.0.0 test db --workdir "$RUNNER_TEMP/blindsolve-db"
      - name: Stop isolated database
        if: always()
        run: npx --yes supabase@3.0.0 stop --workdir "$RUNNER_TEMP/blindsolve-db"
  frontend:
    defaults:
      run:
        working-directory: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:seo
      - run: npx playwright install --with-deps chromium
      - name: Run full browser matrix
        id: browser
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser-results.json
        run: npm run test:e2e -- --reporter=list,html,json
      - name: Record first browser outcome
        id: browser-evidence
        if: ${{ always() && !cancelled() && steps.browser.outcome != 'skipped' }}
        run: |
          if [ -f test-results/.last-run.json ]; then
            cp test-results/.last-run.json test-results/first-run-selection.json
          fi
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const selectionPath = 'test-results/first-run-selection.json';
          const reportPath = 'test-results/browser-results.json';
          if (!fs.existsSync(selectionPath) || !fs.existsSync(reportPath)) {
            throw new Error('Playwright did not finish writing its reports');
          }
          const selection = JSON.parse(fs.readFileSync(selectionPath, 'utf8'));
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failed = selection.failedTests.length;
          console.log(JSON.stringify({ status: selection.status, stats: report.stats, failed }));
          if (selection.status === 'failed' && failed > 0 &&
              failed === report.stats.unexpected && report.errors.length === 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'rerun=true\n');
          }
          NODE
      - name: Upload first browser reports and traces
        id: first-artifact
        if: ${{ always() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-first-attempt
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Run built-artifact worker smoke
        if: ${{ always() && !cancelled() && steps.browser.outcome != 'skipped' }}
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:55551
          PLAYWRIGHT_JSON_OUTPUT_FILE: worker-results/report.json
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 55551 --strictPort &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused "$PLAYWRIGHT_BASE_URL/" >/dev/null
          npm run test:e2e -- e2e/latest-ui.spec.ts -g 'production search worker' --output=worker-results --trace=on --reporter=list,json
      - name: Archive built-artifact worker smoke
        if: ${{ always() && !cancelled() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: built-worker-smoke
          path: web/worker-results/
          if-no-files-found: error
